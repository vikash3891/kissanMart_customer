name: Build iOS Flutter

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"

      - run: flutter pub get

      - run: flutter build ios --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios